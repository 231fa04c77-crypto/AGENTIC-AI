;; Optional local PgBouncer (profile: pool)
;; Prefer Neon pooler URL in production: ...-pooler.neon.tech
[databases]
* = host=host.docker.internal port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = any
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
